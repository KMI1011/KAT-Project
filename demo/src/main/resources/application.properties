spring.application.name=kat-project

# Database connection — prefer environment variables; defaults match local Homebrew PostgreSQL.
# Example vars: DB_URL, DB_USER, DB_PASS, DB_DIALECT, DB_DDL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/katproj}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}

# Hibernate settings
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${DB_DDL:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


